# Satellite outage registry (improvement I8). PROPOSED: read by ws2_platform/coverage.py (audit only).
# Not yet read by ws2_platform/sensors.py, so it changes no pipeline output. Spec: docs/specs/I8_COVERAGE.md.
#
# One entry per interval in UTC. start_utc is inclusive, end_utc exclusive. A granule listed "inclusive" ends 6 minutes
# after its start time. Times are those in the source table; where the table and its comment disagree, the wider
# interval is used and the note says so.
#
# verification:
#   documented        written in a NASA notice already cited in docs/DECISIONS.md
#   table_and_data    listed in the source table AND consistent with our archive (detections resume after it)
#   transcribed       copied from the source table on 4 Nov 2026 via a page summary; a person must check it against
#                     the page before the registry is used to change outputs
# products: the MODAPS table has no product column, so "unspecified" means every SNPP VIIRS product may be affected.
#
# Coverage: the MODAPS table starts 14 Nov 2011. Only multi-hour SNPP entries from 2024-2026 are copied here; earlier
# years still need to be entered (spec section 6) or found by the audit's candidate-gap check.

