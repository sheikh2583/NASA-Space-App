name: Legacy Pages snapshot (manual only)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ws5_frontend/package-lock.json
      - run: npm ci
        working-directory: ws5_frontend
      - run: npm test && npm run check:strings && npm run build
        working-directory: ws5_frontend
        env:
          VITE_DEMO_MODE: snapshot
          VITE_DATA_MODE: real
      - name: Record deployed revision
        env:
          REVISION: ${{ github.sha }}
        run: python -c "import json,os; from pathlib import Path; Path('ws5_frontend/dist/version.json').write_text(json.dumps({'commit':os.environ['REVISION']}))"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ws5_frontend/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
