name: pr-guard
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check changed files against ownership
        # Values from the pull request go through env, never straight into the script (branch names are user input).
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_USER: ${{ github.event.pull_request.user.login }}
          HEAD_REF: ${{ github.head_ref }}
        run: python3 scripts/git/guard.py --range "origin/${BASE_REF}...${HEAD_SHA}" --user "$PR_USER" --branch "$HEAD_REF"
