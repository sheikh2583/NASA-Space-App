name: ci
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - run: pip install -r requirements.lock.txt
      # Agent-safe CI: only reviewed transport/routing checks; no model fits or probes.
      # Full scientific regression and training validation are human-operated.
      - run: python -m compileall -q common scripts ws1_harmonize ws2_platform ws3_anomaly ws4_outlook
      - run: python -m pytest scripts/tests/test_bootstrap.py scripts/tests/test_runtime_bundle.py scripts/tests/test_share_zip.py ws2_platform/tests/test_frontend_hosting.py -q
      - name: Contracts parse
        run: python -c "import yaml,json,glob; from openapi_spec_validator import validate; validate(yaml.safe_load(open('contracts/openapi.yaml'))); [json.load(open(p)) for p in glob.glob('contracts/**/*.json', recursive=True)]"
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ws5_frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ws5_frontend/package-lock.json
      - run: npm ci
      - run: npm run check:strings
      - run: npm test
      - run: npm run build
